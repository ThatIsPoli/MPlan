# Impostazioni di MPlan (D7, NFR.7, design 2.6)

# Il server accetta connessioni solo dallo stesso PC (NFR.7, Q8)
server.address=127.0.0.1
server.port=8642

# Percorso del database SQLite: nella cartella dati dell'utente, senza percorsi assoluti nel codice (VIN.2)
mplan.database=${user.home}/MPlan/mplan.db

# Avvio pulito: niente banner di Spring Boot e niente apertura del browser da parte di Vaadin
# (il browser lo apre AperturaBrowser)
spring.main.banner-mode=off
vaadin.launch-browser=false
